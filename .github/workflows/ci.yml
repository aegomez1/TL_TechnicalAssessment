name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: orderservice
  REGISTRY: ghcr.io/aegomez1

jobs:
  format-and-test:
    if: ${{ !inputs.redeploy_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet format --verify-no-changes
      - run: dotnet build -c Release
      - run: dotnet test
      - run: dotnet list package --vulnerable --incluse-transitive
